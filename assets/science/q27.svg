<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <rect width="900" height="600" fill="#e7f5ff"/>
  <rect x="0" y="420" width="900" height="180" fill="#c98a4b"/>
  <path d="M0 420h900" stroke="#2a2330" stroke-width="5"/>

  <!-- horseshoe magnet -->
  <path d="M340 240V150a110 110 0 0 1 220 0V240h-70V150a40 40 0 0 0-80 0V240z" fill="#e03131" stroke="#2a2330" stroke-width="6" stroke-linejoin="round"/>
  <rect x="340" y="240" width="70" height="40" fill="#ced4da" stroke="#2a2330" stroke-width="6"/>
  <rect x="490" y="240" width="70" height="40" fill="#ced4da" stroke="#2a2330" stroke-width="6"/>
  <path d="M372 70q30-24 64-26" fill="none" stroke="#ffa8a8" stroke-width="10" stroke-linecap="round"/>

  <!-- four things on the table -->
  <!-- iron nail -->
  <g transform="rotate(-8 150 470)">
    <rect x="80" y="462" width="130" height="14" rx="3" fill="#868e96" stroke="#2a2330" stroke-width="5"/>
    <path d="M210 462l26 7-26 7z" fill="#868e96" stroke="#2a2330" stroke-width="5" stroke-linejoin="round"/>
    <rect x="68" y="450" width="16" height="38" rx="4" fill="#868e96" stroke="#2a2330" stroke-width="5"/>
  </g>
  <!-- copper wire -->
  <g fill="none" stroke-linecap="round">
    <path d="M300 500c-30 0-30-50 0-50s30 50 0 50c-30 0-30-50 0-50s30 50 0 50" stroke="#2a2330" stroke-width="12"/>
    <path d="M300 500c-30 0-30-50 0-50s30 50 0 50c-30 0-30-50 0-50s30 50 0 50" stroke="#e8590c" stroke-width="6"/>
    <path d="M340 470c20 0 60 4 70 30" stroke="#2a2330" stroke-width="12"/>
    <path d="M340 470c20 0 60 4 70 30" stroke="#e8590c" stroke-width="6"/>
  </g>
  <!-- wooden pencil -->
  <g transform="rotate(-6 590 480)">
    <rect x="480" y="466" width="170" height="26" fill="#ffd43b" stroke="#2a2330" stroke-width="5"/>
    <path d="M650 466l34 13-34 13z" fill="#f4d9a6" stroke="#2a2330" stroke-width="5" stroke-linejoin="round"/>
    <path d="M672 474l12 5-12 5z" fill="#2a2330"/>
    <rect x="458" y="466" width="24" height="26" fill="#ff8787" stroke="#2a2330" stroke-width="5"/>
  </g>
  <!-- plastic button -->
  <circle cx="790" cy="480" r="38" fill="#9775fa" stroke="#2a2330" stroke-width="5"/>
  <circle cx="790" cy="480" r="26" fill="none" stroke="#5f3dc4" stroke-width="4"/>
  <circle cx="780" cy="470" r="5" fill="#2a2330"/><circle cx="800" cy="470" r="5" fill="#2a2330"/>
  <circle cx="780" cy="490" r="5" fill="#2a2330"/><circle cx="800" cy="490" r="5" fill="#2a2330"/>
</svg>
