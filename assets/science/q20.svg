<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a55"/>
      <stop offset="1" stop-color="#6c7396"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#storm)"/>

  <!-- rain -->
  <g stroke="#a5b4d6" stroke-width="4" stroke-linecap="round" opacity=".6">
    <path d="M90 230l-12 30M170 300l-12 30M260 250l-12 30M360 320l-12 30M460 240l-12 30M560 310l-12 30M660 250l-12 30M760 320l-12 30M840 240l-12 30M130 380l-12 30M520 400l-12 30M800 420l-12 30"/>
  </g>

  <!-- far away: a storm cloud and a lightning bolt -->
  <g fill="#5c6280" stroke="#2a2330" stroke-width="5">
    <circle cx="560" cy="120" r="70"/>
    <circle cx="650" cy="100" r="80"/>
    <circle cx="740" cy="130" r="64"/>
    <rect x="500" y="120" width="300" height="70" rx="35"/>
  </g>
  <path d="M502 150h296" stroke="#5c6280" stroke-width="40"/>
  <path d="M664 180l-60 120h50l-56 140 120-170h-56l50-90z" fill="#ffe066" stroke="#2a2330" stroke-width="5" stroke-linejoin="round"/>
  <path d="M580 300l-30-10M720 280l34-8M600 380l-30 14" stroke="#ffe066" stroke-width="6" stroke-linecap="round"/>

  <!-- hills, a tiny house far away -->
  <path d="M0 470q220-60 450-20t450-10V600H0z" fill="#3f6b45" stroke="#2a2330" stroke-width="5"/>
  <rect x="700" y="420" width="44" height="30" fill="#e9ecef" stroke="#2a2330" stroke-width="4"/>
  <path d="M694 422l28-22 28 22" fill="#c92a2a" stroke="#2a2330" stroke-width="4" stroke-linejoin="round"/>

  <!-- near: a child at a window, watching -->
  <rect x="40" y="250" width="250" height="350" rx="10" fill="#f4d9a6" stroke="#2a2330" stroke-width="6"/>
  <rect x="70" y="280" width="190" height="200" rx="6" fill="#2b3150" stroke="#2a2330" stroke-width="5"/>
  <circle cx="165" cy="400" r="44" fill="#f2c094" stroke="#2a2330" stroke-width="5"/>
  <path d="M121 392q4-46 44-50t44 42q-16-18-44-18t-44 26z" fill="#2a2330"/>
  <circle cx="180" cy="402" r="6" fill="#2a2330"/>
  <circle cx="200" cy="402" r="6" fill="#2a2330"/>
  <ellipse cx="192" cy="424" rx="7" ry="9" fill="#2a2330"/>
  <path d="M110 480q55-40 110 0" fill="#4dabf7" stroke="#2a2330" stroke-width="5"/>
  <rect x="60" y="480" width="210" height="26" rx="6" fill="#c98a4b" stroke="#2a2330" stroke-width="5"/>
</svg>
