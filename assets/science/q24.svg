<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <g id="sun">
      <circle r="40" fill="#ffe066" stroke="#fab005" stroke-width="6"/>
      <path d="M0 -54v-12M0 54v12M-54 0h-12M54 0h12M-38 -38l-9 -9M38 38l9 9M38 -38l9 -9M-38 38l-9 9" stroke="#fab005" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- left: daytime on Earth -->
  <rect width="450" height="600" fill="#74c0fc"/>
  <use href="#sun" x="340" y="110"/>
  <ellipse cx="110" cy="130" rx="70" ry="24" fill="#fff" opacity=".9"/>
  <path d="M0 440q110-24 225 0t225 0V600H0z" fill="#82c96c" stroke="#2a2330" stroke-width="5" stroke-linejoin="round"/>
  <!-- a child looking up -->
  <rect x="200" y="400" width="44" height="90" rx="18" fill="#ff922b" stroke="#2a2330" stroke-width="5"/>
  <circle cx="222" cy="372" r="30" fill="#f2c094" stroke="#2a2330" stroke-width="5"/>
  <path d="M192 368q0-34 30-34t30 30q-14-12-30-12t-30 16z" fill="#2a2330"/>
  <circle cx="232" cy="366" r="4" fill="#2a2330"/>
  <path d="M206 490v40M238 490v40" stroke="#2a2330" stroke-width="10" stroke-linecap="round"/>

  <rect x="446" y="0" width="8" height="600" fill="#fff"/>

  <!-- right: daytime on the Moon; what colour is its sky? -->
  <rect x="454" width="446" height="600" fill="#dee2e6"/>
  <g fill="#adb5bd" opacity=".6">
    <path d="M500 60l20 20-20 20-20-20zM860 90l16 16-16 16-16-16zM600 250l14 14-14 14-14-14z"/>
  </g>
  <circle cx="676" cy="190" r="70" fill="#fff" stroke="#2a2330" stroke-width="6"/>
  <text x="676" y="222" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" text-anchor="middle" fill="#c92a2a">?</text>
  <use href="#sun" x="830" y="70" transform="translate(830 70) scale(.8) translate(-830 -70)"/>
  <path d="M454 430q110-20 223 0t223 -10V600H454z" fill="#adb5bd" stroke="#2a2330" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="540" cy="520" rx="40" ry="12" fill="#868e96"/>
  <ellipse cx="820" cy="560" rx="50" ry="14" fill="#868e96"/>
  <!-- astronaut -->
  <rect x="700" y="390" width="66" height="90" rx="22" fill="#f8f9fa" stroke="#2a2330" stroke-width="5"/>
  <rect x="770" y="404" width="22" height="56" rx="8" fill="#ced4da" stroke="#2a2330" stroke-width="5"/>
  <circle cx="733" cy="358" r="36" fill="#f8f9fa" stroke="#2a2330" stroke-width="5"/>
  <rect x="711" y="342" width="44" height="28" rx="12" fill="#495057" stroke="#2a2330" stroke-width="4"/>
  <path d="M718 350q8-6 18-6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M714 480v40M752 480v40" stroke="#2a2330" stroke-width="14" stroke-linecap="round"/>
  <path d="M714 480v40M752 480v40" stroke="#f8f9fa" stroke-width="7" stroke-linecap="round"/>
</svg>
