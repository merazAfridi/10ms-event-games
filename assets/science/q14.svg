<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- room: teal wall, wooden floor -->
  <rect width="900" height="600" fill="#6fb3b0"/>
  <rect x="0" y="500" width="900" height="100" fill="#c98a4b"/>
  <path d="M0 500h900" stroke="#2a2330" stroke-width="5"/>
  <path d="M40 540h140M300 566h120M520 534h160M740 572h110" stroke="#a96d36" stroke-width="5" stroke-linecap="round"/>

  <!-- table -->
  <rect x="330" y="214" width="26" height="286" fill="#9a5e2e" stroke="#2a2330" stroke-width="5"/>
  <rect x="544" y="214" width="26" height="286" fill="#9a5e2e" stroke="#2a2330" stroke-width="5"/>
  <rect x="300" y="180" width="300" height="34" rx="6" fill="#b5723a" stroke="#2a2330" stroke-width="5"/>

  <!-- both balls start at the same height -->
  <path d="M286 154H540" stroke="#fff" stroke-width="4" stroke-dasharray="10 10" opacity=".75"/>

  <!-- red ball: simply let go, falls straight down -->
  <path d="M250 196V474" fill="none" stroke="#c92a2a" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round"/>
  <path d="M236 454l14 22 14-22" fill="none" stroke="#c92a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="154" r="26" fill="#fa5252" stroke="#2a2330" stroke-width="5"/>
  <path d="M238 142a14 14 0 0 1 12-6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M120 24L228 108" stroke="#2a2330" stroke-width="34" stroke-linecap="round"/>
  <path d="M120 24L228 108" stroke="#f2c094" stroke-width="24" stroke-linecap="round"/>
  <path d="M222 92q30-6 40 18q-4 14-18 12q-10 8-22-2q-12-8-6-20z" fill="#f2c094" stroke="#2a2330" stroke-width="5" stroke-linejoin="round"/>
  <path d="M206 126l4 10M268 126l-4 10" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

  <!-- blue ball: rolls off the edge of the table -->
  <path d="M600 154C700 154 800 250 836 474" fill="none" stroke="#1971c2" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round"/>
  <path d="M818 458l18 20 6-26" fill="none" stroke="#1971c2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M500 140h34M490 156h44M500 172h34" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  <circle cx="574" cy="154" r="26" fill="#4dabf7" stroke="#2a2330" stroke-width="5"/>
  <path d="M562 142a14 14 0 0 1 12-6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
