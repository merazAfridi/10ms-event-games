<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc7ef"/>
      <stop offset="1" stop-color="#d4f0fb"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>
  <rect x="0" y="470" width="900" height="130" fill="#495057"/>
  <path d="M0 470h900" stroke="#2a2330" stroke-width="5"/>
  <path d="M40 540h120M260 540h120M520 540h120M760 540h120" stroke="#fff" stroke-width="8" stroke-linecap="round"/>

  <!-- ambulance, seen from the front -->
  <rect x="200" y="90" width="500" height="370" rx="36" fill="#f8f9fa" stroke="#2a2330" stroke-width="6"/>
  <!-- siren lights -->
  <rect x="330" y="56" width="70" height="40" rx="10" fill="#fa5252" stroke="#2a2330" stroke-width="5"/>
  <rect x="500" y="56" width="70" height="40" rx="10" fill="#4dabf7" stroke="#2a2330" stroke-width="5"/>
  <path d="M310 46l-20-16M590 46l20-16M300 70h-24M600 70h24" stroke="#fab005" stroke-width="6" stroke-linecap="round"/>
  <!-- windscreen -->
  <path d="M240 130h420l-20 120H260z" fill="#a5d8ff" stroke="#2a2330" stroke-width="6" stroke-linejoin="round"/>
  <path d="M290 150l-20 80M330 150l-16 60" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <!-- the word on the bonnet, printed mirror-reversed -->
  <rect x="226" y="268" width="448" height="62" rx="8" fill="#fff" stroke="#e03131" stroke-width="5"/>
  <text transform="translate(450 315) scale(-1 1)" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900" letter-spacing="3" text-anchor="middle" fill="#e03131">AMBULANCE</text>
  <!-- stripe, lights, grille -->
  <rect x="200" y="346" width="500" height="22" fill="#e03131"/>
  <circle cx="262" cy="404" r="26" fill="#ffe066" stroke="#2a2330" stroke-width="5"/>
  <circle cx="638" cy="404" r="26" fill="#ffe066" stroke="#2a2330" stroke-width="5"/>
  <rect x="350" y="386" width="200" height="40" rx="8" fill="#adb5bd" stroke="#2a2330" stroke-width="5"/>
  <path d="M370 396v20M400 396v20M430 396v20M460 396v20M490 396v20M520 396v20" stroke="#2a2330" stroke-width="4"/>
  <!-- wheels -->
  <rect x="226" y="450" width="70" height="40" rx="10" fill="#2a2330"/>
  <rect x="604" y="450" width="70" height="40" rx="10" fill="#2a2330"/>
</svg>
